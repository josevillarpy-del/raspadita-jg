<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raspa Bono Millonario - Jose</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
body{background:#0d062e;color:#fff}
.cinta{height:14px;background:repeating-linear-gradient(90deg,#ff5a5a 0 20px,#ffd000 20px 40px,#5ad66f 40px 60px,#4d8cff 60px 80px)}
.wrap{max-width:420px;margin:0 auto;padding:10px}
.card{background:#fff;color:#222;border-radius:16px;overflow:hidden}
.body{padding:14px;background:#f8f5ff}
.btn{width:100%;border:none;border-radius:999px;padding:14px;font-weight:bold;font-size:15px;margin:8px 0;cursor:pointer}
.btn-y{background:#ffcc00}.btn-g{background:#25D366;color:#fff}.btn-p{background:#6c4bff;color:#fff}
.input{width:100%;padding:12px;border-radius:999px;border:1px solid #ddd;margin:6px 0}
.hidden{display:none}
#scratchBox{position:relative;width:100%;height:320px;background:#fff;border-radius:16px;overflow:hidden;border:4px solid #ffcc00}
#prizes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:10px;height:100%}
.prize{background:#fff9c4;border:1px solid #e5c200;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#cover{position:absolute;inset:0;touch-action:none}
</style>
</head>
<body>
<div class="cinta"></div>
<div class="wrap">
<div id="admin">
<h2 style="text-align:center;margin:14px 0">RASPADITA ONLINE<br><span style="font-size:11px;background:#00c851;padding:4px 10px;border-radius:999px">PANEL DE JOSE - 595971142600</span></h2>
<div class="card"><div class="body">
<input id="cli" class="input" placeholder="Nombre del cliente" value="Jose Gonzalez">
<select id="cant" class="input"><option value="1">1 carton - 5.000 Gs</option><option value="2" selected>2 cartones - 10.000 Gs</option><option value="3">3 cartones - 15.000 Gs</option><option value="5">5 cartones - 25.000 Gs</option></select>
<button class="btn btn-p" onclick="gen()">GENERAR LINK DE VENTA</button>
<div id="res" class="hidden"><div id="link" style="background:#fff;border:2px dashed #6c4bff;padding:10px;border-radius:10px;font-size:11px;word-break:break-all;margin:8px 0"></div>
<button class="btn btn-g" onclick="copy()">COPIAR LINK</button>
<button class="btn" style="background:#222;color:#fff" onclick="window.open(document.getElementById('link').innerText,'_blank')">VER COMO CLIENTE</button></div>
</div></div>
</div>
<div id="client" class="hidden">
<div class="card"><div class="body">
<div id="step1"><h3 style="text-align:center">Hola, <span id="cName">Cliente</span></h3><p style="font-size:12px;text-align:center">Compraste <span id="cCant">2</span> cartones</p>
<input id="buscar" class="input" placeholder="Busca tu numero Ej: 36816" oninput="filtrar()">
<div id="grid" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0"></div>
<div style="display:flex;justify-content:space-between;font-size:12px"><button onclick="pag(-1)">Anterior</button><span id="pag">1/4</span><button onclick="pag(1)">Siguiente</button></div>
<div style="font-size:11px;margin-top:10px">Elegidos <span id="count">0/2</span></div>
<div id="elegidos" style="background:#eee;border-radius:999px;padding:8px;font-size:11px">Elige tus cartones</div>
<button id="btnConf" class="btn btn-y" disabled onclick="conf()">Confirmar y raspar</button></div>
<div id="step2" class="hidden"><div style="display:flex;justify-content:space-between;font-size:11px"><span id="prog">Carton 1 de 2</span></div>
<div id="scratchBox"><div id="prizes"></div><canvas id="cover"></canvas></div><div style="font-size:10px;text-align:center">Raspa todo - <span id="pct">0%</span></div></div>
<div id="step3" class="hidden"><div style="background:#1a0b4e;border-radius:16px;padding:16px;text-align:center">
<div id="rMonto" style="font-size:30px;color:#ffdf4a;font-weight:900">GANASTE</div>
<div style="background:#fff;color:#222;border-radius:12px;padding:8px;margin:10px 0">Nro: <b id="rNum">36816</b> - Serie A79161<br><b id="rName">Jose</b></div>
<button class="btn" style="background:#fff" onclick="nextCarton()">Siguiente carton</button>
<button class="btn btn-g" onclick="cobrar()">RECLAMAR POR WHATSAPP</button></div></div>
</div></div>
</div>
</div>
<script>
const MI_WSP="595971142600";
const premios=[{i:'💰',t:'5.000.000 GS',p:0.5},{i:'💎',t:'3.000.000 GS',p:0.8},{i:'👑',t:'1.000.000 GS',p:1.2},{i:'☂️',t:'50.000 GS',p:4},{i:'🃏',t:'30.000 GS',p:8},{i:'🐦',t:'5.000 GS',p:20},{i:'🍀',t:'0',p:65.5}];
function pick(){let r=Math.random()*100,a=0;for(let x of premios){a+=x.p;if(r<=a)return x;}return premios[6];}
let all=[],sel=[],pg=0,ci=0,need=2,name='Cliente';const PS=6;
let baseNum=parseInt(localStorage.getItem('ultimo_num')||'36816');
function gen(){need=parseInt(document.getElementById('cant').value);name=document.getElementById('cli').value||'Jose';let id='RO'+Date.now().toString().slice(-7);all=[];for(let k=0;k<24;k++){all.push({num:baseNum,pr:pick()});baseNum++;}localStorage.setItem('ultimo_num',baseNum);let d={cant:need,nombre:name,cartones:all,id:id};localStorage.setItem('venta_'+id,JSON.stringify(d));let link=location.href.split('?')[0]+'?orden='+id;document.getElementById('link').innerText=link;document.getElementById('res').classList.remove('hidden');window._link=link;}
function copy(){navigator.clipboard.writeText(window._link);alert('Copiado');}
function init(){let o=new URLSearchParams(location.search).get('orden');if(!o)return;document.getElementById('admin').classList.add('hidden');document.getElementById('client').classList.remove('hidden');let s=localStorage.getItem('venta_'+o);let d=s?JSON.parse(s):{cant:2,nombre:'Jose',cartones:[]};if(!s){for(let k=0;k<24;k++)d.cartones.push({num:36816+k,pr:pick()});d.cant=2;}all=d.cartones;need=d.cant;name=d.nombre;document.getElementById('cName').innerText=name;document.getElementById('cCant').innerText=need;render();}
let f='';function filtrar(){f=document.getElementById('buscar').value;render();}
function render(){let g=document.getElementById('grid');g.innerHTML='';let list=f?all.map((c,i)=>({...c,idx:i})).filter(c=>String(c.num).includes(f)):all.map((c,i)=>({...c,idx:i}));let sl=list.slice(pg*PS,(pg+1)*PS);sl.forEach(c=>{let d=document.createElement('div');d.style.cssText='background:#fff;border:2px solid '+(sel.includes(c.idx)?'#00c851':'#e5ddff')+';border-radius:14px;padding:8px;text-align:center;cursor:pointer';d.innerHTML='<div style="height:58px;background:linear-gradient(135deg,#ffdf4a,#ff8a00);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:bold">N '+c.num+'</div><div style="font-weight:bold">N '+c.num+'</div>';d.onclick=()=>{let p=sel.indexOf(c.idx);if(p>-1)sel.splice(p,1);else{if(sel.length>=need){alert('Solo '+need);return;}sel.push(c.idx);}render();};g.appendChild(d);});document.getElementById('pag').innerText=(pg+1)+'/'+Math.ceil(list.length/PS);document.getElementById('count').innerText=sel.length+'/'+need;document.getElementById('elegidos').innerText=sel.length?sel.map(i=>all[i].num).join(', '):'Elige tus cartones';document.getElementById('btnConf').disabled=sel.length!=need;}
function pag(d){let m=Math.ceil(all.length/PS)-1;pg+=d;if(pg<0)pg=0;if(pg>m)pg=m;render();}
function conf(){ci=0;document.getElementById('step1').classList.add('hidden');document.getElementById('step2').classList.remove('hidden');show();}
function show(){let c=all[sel[ci]];document.getElementById('prog').innerText='Carton '+(ci+1)+' de '+sel.length+' - '+c.num;let pz=document.getElementById('prizes');pz.innerHTML='';let icons;if(c.pr.t==='0'){icons=Array(9).fill(0).map(()=>premios[Math.floor(Math.random()*premios.length)]);}else{let win=premios.find(x=>x.t===c.pr.t);icons=[win,win,win,...Array(6).fill(0).map(()=>premios.filter(x=>x.t!==c.pr.t)[Math.floor(Math.random()*6)])];}icons.sort(()=>Math.random()-0.5);icons.forEach(o=>{let d=document.createElement('div');d.className='prize';d.innerHTML='<div style="font-size:26px">'+o.i+'</div><b>'+(o.t==='0'?'SIN PREMIO':o.t)+'</b>';pz.appendChild(d);});initScratch();}
let cv,cx,down=false,ct=0;
function initScratch(){cv=document.getElementById('cover');cx=cv.getContext('2d');let w=document.getElementById('scratchBox');cv.width=w.offsetWidth;cv.height=w.offsetHeight;cx.fillStyle='#C0C0C0';cx.fillRect(0,0,cv.width,cv.height);cx.fillStyle='#333';cx.font='bold 18px Arial';cx.textAlign='center';cx.fillText('TOCA Y RASPA',cv.width/2,cv.height/2);ct=0;cv.onmousedown=()=>down=true;cv.ontouchstart=()=>down=true;cv.onmouseup=()=>down=false;cv.ontouchend=()=>down=false;cv.onmousemove=e=>scratch(e);cv.ontouchmove=e=>scratch(e);}
function scratch(e){if(!down)return;let r=cv.getBoundingClientRect();let x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;let y=(e.touches?e.touches[0].clientY:e.clientY)-r.top;cx.globalCompositeOperation='destination-out';cx.beginPath();cx.arc(x,y,26,0,Math.PI*2);cx.fill();ct++;document.getElementById('pct').innerText=Math.min(100,Math.floor(ct/0.8))+'%';if(ct>40)end();}
function end(){let c=all[sel[ci]];document.getElementById('step2').classList.add('hidden');document.getElementById('step3').classList.remove('hidden');document.getElementById('rMonto').innerHTML=c.pr.t==='0'?'CASI! Seguí intentando':'GANASTE<br>'+c.pr.t;document.getElementById('rNum').innerText=c.num;document.getElementById('rName').innerText=name;}
function nextCarton(){ci++;if(ci<sel.length){document.getElementById('step3').classList.add('hidden');document.getElementById('step2').classList.remove('hidden');show();}else{alert('Terminaste!');location.href=location.href.split('?')[0];}}
function cobrar(){let c=all[sel[ci]];let msg='Hola Jose! Soy '+name+', gane '+c.pr.t+' en la Raspadita. Mi carton es N '+c.num+' Serie A79161. Me pagas?';window.open('https://wa.me/'+MI_WSP+'?text='+encodeURIComponent(msg),'_blank');}
window.onload=init;
</script>
</body>
</html>
