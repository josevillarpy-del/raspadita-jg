<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raspa & Gana - Noviembre Brilla</title>
<style>
{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0a1a0f;color:#fff;min-height:100vh;background-image:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.78)),radial-gradient(circle at 50% 0%,#2a1a0a 0%,#0a1a0f 70%);background-attachment:fixed}
.top{background:rgba(0,30,15,.92);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}
.top h1{font-size:22px;color:#f5e6a8;line-height:1}.top small{font-size:10px;letter-spacing:2px;color:#d4a017}.top span{font-size:13px}
.btn-cerrar{background:#3a4a42;color:#7ee8c0;border:none;padding:10px 18px;border-radius:12px;font-weight:800;font-size:15px;cursor:pointer}
.btn-musica{background:#6a1a7a;color:#fff;border:none;padding:9px 16px;border-radius:12px;font-weight:800;cursor:pointer}
.wrap{max-width:520px;margin:auto;padding:14px 14px 40px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0 18px}
.card-stat{background:rgba(20,20,15,.92);border:1px solid #c9a84c;border-radius:16px;padding:14px}
.card-stat b{font-size:30px;color:#a8e6c5;display:block}.card-stat span{font-size:12px;letter-spacing:1px;color:#ddd;display:block;margin-top:6px}
.box{background:rgba(15,15,12,.92);border:1px solid #5a4a20;border-radius:20px;padding:16px;margin-top:14px}
.box h2{color:#7ee8c0;font-size:20px;margin-bottom:8px}.box p{font-size:13px;line-height:1.5;color:#ccc}
label{font-size:14px;font-weight:800;display:block;margin:16px 0 8px}
input{width:100%;padding:14px;border-radius:14px;border:1px solid #4a4a3a;background:#2a2a22;color:#fff;font-size:15px;outline:none}
input::placeholder{color:#999}
.inventario{background:#1e2a22;border:1px solid #3a6a4a;border-radius:14px;padding:14px;font-weight:900;font-size:18px}
.opt{border-radius:14px;padding:14px;margin-top:10px;cursor:pointer;border:2px solid transparent}.opt.sel{background:#3b1ad6;border-color:#6a4aff}.opt.nosel{background:#4a4a42}
.opt b{font-size:15px}.opt p{font-size:13px;margin-top:4px}
.btn{width:100%;padding:16px;border:none;border-radius:14px;font-weight:900;font-size:18px;cursor:pointer;margin-top:14px}
.btn-verde{background:#0a7a3a;color:#fff}.btn-amarillo{background:#ffcc00;color:#222}.btn-gris{background:#2a2a2a;color:#fff}
.linkBox{background:#000;color:#ffcc00;padding:10px;border-radius:10px;word-break:break-all;font-size:12px;margin:10px 0}
.oculto{display:none!important}.chip{display:inline-block;background:#ffcc00;color:#222;padding:6px 12px;border-radius:20px;font-weight:800;margin:4px;font-size:13px}
/ CLIENTE ELEGIR /
.hero{background:rgba(0,0,0,.6);border:1px solid #6c3bb5;border-radius:18px;padding:18px;text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:12px 0}
.carton{background:#fff;color:#222;border-radius:14px;padding:8px;text-align:center;cursor:pointer;border:3px solid transparent}
.carton.sel{border-color:#ffcc00;background:#fff8c0;transform:scale(1.03)}
.carton .mini{height:58px;border-radius:8px;background:linear-gradient(135deg,#2ed573,#1e90ff,#ffdd59);display:flex;align-items:center;justify-content:center;font-size:28px}
/ CARTON RASPAR */
.cartonHead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.cartonHead h3{color:#e8c8ff;font-size:19px;line-height:1.2}.cartonHead span{font-size:14px;color:#e8c8ff}
.cartonReal{background:linear-gradient(180deg,#1a5c2a,#0a3a1a,#0a2a1a);border:3px solid #6a2a9a;border-radius:18px;overflow:hidden;position:relative;padding:14px 12px 12px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.cartonTop{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:2}
.precioBadge{background:#1e3aff;color:#fff;padding:8px 12px;border-radius:8px;font-size:12px;font-weight:900;line-height:1.2;text-align:center}
.logoBono{text-align:center;flex:1}
.logoBono h2{font-size:26px;color:#ffd700;text-shadow:2px 2px 0 #000;line-height:.95}
.logoBono small{font-size:10px;background:#ffd700;color:#000;padding:2px 6px;border-radius:4px;font-weight:900}
.bannerRojo{background:#b91c1c;color:#fff;text-align:center;font-size:11px;font-weight:900;padding:7px 10px;border-radius:20px;margin:10px 0;display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2}
.bannerRojo .mas18{background:#6a1a7a;padding:4px 8px;border-radius:8px;font-size:12px}
.cartonBody{display:flex;gap:10px;position:relative;z-index:2}
.numVertical{writing-mode:vertical-rl;transform:rotate(180deg);background:#1e1a5a;color:#fff;font-size:11px;font-weight:900;padding:10px 6px;border-radius:8px;text-align:center;letter-spacing:1px}
#scratchWrap{flex:1;position:relative;height:260px;background:rgba(0,0,0,.85);border-radius:10px;overflow:hidden}
#premioGrid{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr 1fr;gap:6px;padding:8px}
.cell{background:#111;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:30px}
.cell span{font-size:10px;font-weight:800;color:#fff;margin-top:2px}
.cell.win{box-shadow:0 0 0 3px #ffd700,0 0 15px #ffd700}
#canvasScratch{position:absolute;inset:0;touch-action:none;cursor:pointer;z-index:5}
.cartonFoot{display:flex;justify-content:space-between;margin-top:10px;position:relative;z-index:2}
.cartonFoot span{font-size:10px;font-weight:900;background:rgba(0,0,0,.6);padding:6px 8px;border-radius:6px;color:#fff}
.cartonFoot span b{color:#ffd700}
.resultado{background:linear-gradient(180deg,#4a0a0a,#2a0505);border:2px solid #8a6a1a;border-radius:20px;padding:20px 16px;text-align:center;margin-top:16px}
.resultado .sub{font-size:12px;letter-spacing:2px;color:#ddd;font-weight:800}
.resultado h2{font-size:38px;color:#f5e6b8;margin:8px 0 0;line-height:1}
.resultado .monto{font-size:42px;font-weight:900;color:#f5
